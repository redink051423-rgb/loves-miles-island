<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#8fbccb;
  --paper:rgba(255,255,255,.92);
  --paper-solid:#FFFFFF;
  --ink:#16262b;
  --muted:#58696d;
  --line:#d3dedd;
  --accent:#456FFF;
  --accent-ink:#FFFFFF;
  --coral:#FF846C;
  --chip:#eef3f2;
  --shadow:0 10px 30px rgba(18,40,48,.16);
  --sans:"Microsoft JhengHei","微軟正黑體","PingFang TC","Heiti TC","Noto Sans TC",sans-serif;
  --display:var(--sans);
  --tbh:110px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10283a;
    --paper:rgba(19,32,37,.9);
    --paper-solid:#132025;
    --ink:#e6eeed;
    --muted:#9db0b2;
    --line:#2b3d42;
    --accent:#6f8dff;
    --accent-ink:#FFFFFF;
    --coral:#FF846C;
    --chip:#1d2e33;
    --shadow:0 10px 30px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10283a;
  --paper:rgba(19,32,37,.9);
  --paper-solid:#132025;
  --ink:#e6eeed;
  --muted:#9db0b2;
  --line:#2b3d42;
  --accent:#6f8dff;
  --accent-ink:#FFFFFF;
  --coral:#FF846C;
  --chip:#1d2e33;
  --shadow:0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#stage{position:fixed;inset:0}
#stage canvas{display:block}
.labels{position:fixed;inset:0;pointer-events:none}

.glass{background:var(--paper);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);box-shadow:var(--shadow)}

/* brand */
.brand{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;max-width:400px;padding:14px 18px 14px;border-radius:16px}
.brand h1{color:var(--accent);font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;margin:0;letter-spacing:.02em}
.brand .sub{margin:6px 0 0;color:var(--muted);font-size:13px}
.brand .datanote{display:inline-block;margin:10px 0 0;padding:3px 10px;border-radius:999px;background:var(--chip);font-size:12px;color:var(--muted)}
.brand .datanote b{color:var(--ink);font-weight:500}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper-solid)}
.seg span{padding:5px 8px 5px 10px;color:var(--muted);font-size:12px;align-self:center}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12px;border-left:1px solid var(--line)}
.seg-plain button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--paper-solid);border-radius:10px;padding:5px 12px;font-size:12px}
.btn:hover{border-color:var(--accent)}

/* panel */
.panel{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;bottom:calc(var(--tbh) + 28px + env(safe-area-inset-bottom,0px));width:310px;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:14px 14px 8px;display:flex;gap:8px;align-items:center}
.collapse{flex:none;border:1px solid var(--line);background:var(--paper-solid);border-radius:10px;padding:8px 12px;font-size:12.5px;white-space:nowrap}
.collapse:hover{border-color:var(--accent)}
.panel.collapsed{bottom:auto;width:auto}
.panel.collapsed>:not(.panel-head){display:none}
.panel.collapsed .panel-head{padding:8px}
.panel.collapsed .panel-head input{display:none}
.events{list-style:none;margin:12px 0 0;padding:6px 0 0;max-height:190px;overflow:auto;border-top:1px solid var(--line)}
.events button{display:grid;grid-template-columns:5.2em 1fr;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:5px 6px;border-radius:8px;font-size:12.5px;line-height:1.4}
.events button:hover{background:var(--chip)}
.events button[aria-current="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.events .dd{color:var(--muted);font-variant-numeric:tabular-nums}
.events .fut{color:var(--accent);font-size:11px;margin-left:4px}
.events[hidden]{display:none}
.panel-head input{flex:1;min-width:0;font-size:16px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper-solid)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper-solid);border-radius:999px;padding:3px 10px 3px 8px;font-size:12px}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip em{font-style:normal;color:var(--muted)}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] i{background:transparent!important;border:1.5px solid var(--muted)}
.summary{padding:6px 14px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.summary b{color:var(--ink);font-weight:700}
.units{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.units button{display:grid;grid-template-columns:4px 1fr;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:7px 8px}
.units button:hover{background:var(--chip)}
.units button[aria-current="true"]{background:var(--chip);box-shadow:inset 0 0 0 1.5px var(--accent)}
.units .bar{border-radius:3px}
.units .nm{font-weight:500;font-size:13.5px}
.units .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.units .meta .mv{color:var(--coral);font-weight:700}
.units .empty{padding:20px 10px;color:var(--muted);font-size:13px}
.import{border-top:1px solid var(--line);padding:10px 14px 14px;font-size:12.5px}
.import summary{cursor:pointer;font-weight:500;font-size:13px}
.import p{margin:8px 0;color:var(--muted)}
.import pre{margin:8px 0;padding:8px 10px;background:var(--chip);border-radius:8px;font-size:11px;line-height:1.45;overflow-x:auto;white-space:pre}
.import .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.filebtn{position:relative;overflow:hidden;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:6px 14px;font-size:12.5px;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.msg{font-size:12px;margin-top:8px;color:var(--ink)}
.msg.err{color:#c2412d}

/* detail */
.detail{position:fixed;left:16px;bottom:calc(var(--tbh) + 28px + env(safe-area-inset-bottom,0px));width:330px;border-radius:16px;padding:16px 18px}
.detail[hidden]{display:none}
.detail .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:var(--chip);font-size:16px;line-height:1}
.detail h2{font-family:var(--display);font-size:21px;margin:0 32px 6px 0;line-height:1.25}
.detail .topic{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px 2px 8px;border-radius:999px;background:var(--chip)}
.detail .topic i{width:9px;height:9px;border-radius:50%}
.detail .status{color:var(--coral);margin:10px 0 8px;font-size:14px;font-weight:500}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;font-variant-numeric:tabular-nums}
.detail .also{font-size:12px;color:var(--muted);margin:8px 0 0}
.detail .row{display:flex;gap:8px;margin-top:12px}
.detail .row .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* timebar */
.timebar{position:fixed;left:16px;right:342px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:16px;padding:12px 18px 10px}
.tb-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.play{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px}
.clock{display:flex;align-items:baseline;gap:10px;min-width:0}
.clock .d{font-family:var(--display);font-size:20px;font-weight:700;white-space:nowrap}
.clock .t{font-size:20px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tb-spacer{flex:1}
.tb-row select{border:1px solid var(--line);background:var(--paper-solid);border-radius:10px;padding:5px 8px;font-size:12.5px}
.track{position:relative;margin-top:10px;padding-bottom:16px}
.track input{width:100%;margin:0;accent-color:var(--accent);height:22px}
.ticks{position:absolute;left:0;right:0;bottom:0;height:14px;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* labels on map */
.tag{pointer-events:auto;cursor:pointer;transform:translateY(-6px);padding:3px 8px 3px 7px;border-radius:8px;background:rgba(252,253,252,.94);color:#16262b;border-left:3px solid var(--c);box-shadow:0 2px 8px rgba(10,30,40,.18);white-space:nowrap;line-height:1.25;font-family:var(--sans)}
.tag .n{display:block;font-size:11.5px;font-weight:700}
.tag .p{display:block;font-size:10.5px;color:#4b5d61}
.tag.sel{background:#456FFF;color:#FFFFFF;border-left-color:#FF846C}
.tag.sel .p{color:#FFFFFF;opacity:.85}
.tag.parked{opacity:.82}
.far .tag.parked .p{display:none}
.far .tag.parked{padding:2px 6px;opacity:.75}
.far .tag.parked .n{font-size:10.5px;font-weight:500}
.city{font-family:var(--display);font-size:12px;color:rgba(22,38,43,.62);text-shadow:0 1px 0 rgba(255,255,255,.6);pointer-events:none;letter-spacing:.1em}
.night .city{color:rgba(255,236,190,.75);text-shadow:none}

.sheet-toggle{display:none}
.nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink)}

@media (max-width:760px){
  .brand{left:10px;right:10px;max-width:none;padding:10px 14px;top:calc(10px + env(safe-area-inset-top,0px))}
  .brand h1{font-size:20px}
  .brand .sub{font-size:12px;margin-top:2px}
  .brand .datanote{margin-top:6px}
  .tools{margin-top:8px}
  .timebar{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:10px 12px 8px}
  .clock .d{font-size:16px}.clock .t{font-size:16px}
  .play{width:38px;height:38px}
  .panel{left:10px;right:10px;width:auto;top:auto;bottom:calc(var(--tbh) + 20px + env(safe-area-inset-bottom,0px));max-height:56vh;display:none}
  .panel.open{display:flex}
  .detail{left:10px;right:10px;width:auto;bottom:calc(var(--tbh) + 20px + env(safe-area-inset-bottom,0px))}
  .sheet-toggle{display:inline-block}
  .collapse{display:none}
  .day-btns{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.detail dd{overflow-wrap:anywhere}

/* compact panels so the island gets more room */
.tag{padding:2px 6px 2px 5px;border-radius:6px;border-left-width:2.5px}
.tag .n{font-size:10px}
.tag .p{font-size:9px}
.city{font-size:11px}
@media (min-width:761px){
  .brand{top:calc(12px + env(safe-area-inset-top,0px));left:12px;max-width:none;padding:10px 14px;border-radius:12px}
  .brand h1{font-size:18px}
  .brand .sub{font-size:11.5px;margin-top:3px}
  .tools{margin-top:8px;gap:6px}
  .seg button,.btn{font-size:11.5px;padding:3px 9px}
  .panel{top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:250px;border-radius:12px;bottom:calc(var(--tbh) + 20px + env(safe-area-inset-bottom,0px))}
  .panel-head{padding:10px 10px 6px;gap:6px}
  .panel-head input{font-size:13px;padding:5px 9px;border-radius:8px}
  .collapse{padding:5px 9px;font-size:11.5px;border-radius:8px}
  .chips{padding:2px 10px 8px;gap:4px}
  .chip{font-size:11px;padding:2px 8px 2px 6px;gap:5px}
  .chip i{width:7px;height:7px}
  .summary{font-size:11px;padding:4px 10px 6px}
  .units{padding:4px}
  .units button{padding:5px 6px;gap:8px;border-radius:8px}
  .units .nm{font-size:12.5px}
  .units .meta{font-size:11px;gap:6px}
  .import{font-size:11.5px;padding:8px 10px 10px}
  .import summary{font-size:12px}
  .detail{left:12px;width:270px;padding:12px 14px;border-radius:12px;bottom:calc(var(--tbh) + 20px + env(safe-area-inset-bottom,0px))}
  .detail .x{width:26px;height:26px;font-size:14px;top:8px;right:8px}
  .detail h2{font-size:16px;margin-bottom:4px}
  .detail .topic{font-size:11px}
  .detail .status{font-size:12.5px;margin:8px 0 6px}
  .detail dl{font-size:12px;gap:3px 12px}
  .events{max-height:150px}
  .events button{font-size:11.5px;padding:4px 5px}
  .detail .row{margin-top:10px}
  .timebar{left:12px;right:274px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:8px 14px 6px;border-radius:12px}
  .tb-row{gap:10px}
  .play{width:32px;height:32px}
  .play svg{width:14px;height:14px}
  .clock .d,.clock .t{font-size:15px}
  .tb-row select{font-size:11.5px;padding:3px 6px;border-radius:8px}
  .track{margin-top:6px;padding-bottom:14px}
  .track input{height:18px}
  .ticks{font-size:10px}
}
.import[hidden]{display:none}
.timebar.mini{right:auto;padding-bottom:8px}
.tb-toggle{width:28px;height:28px;padding:0!important;display:grid;place-items:center;font-size:18px!important;line-height:1;font-weight:500}

.tour-step{font-size:11.5px;color:var(--coral);font-weight:700;letter-spacing:.05em}

<body>
<div id="stage"></div>

<header class="brand glass">
  <h1>愛的里程數動態島</h1>
  <p class="sub" id="sub">正在載入用車紀錄…</p>
  <div class="tools">
    <div class="seg seg-plain" role="group" aria-label="顯示哪些車的單位名稱">
      <button data-lab="all" aria-pressed="true">全部</button>
      <button data-lab="moving" aria-pressed="false">出勤中</button>

function renderTicks() {
  const el = $('#ticks'); el.innerHTML = '';
  const span = tMax - tMin; if (span <= 0) return;
  const a = parts(tMin);
  let y = a.y, m = a.m + 1; if (m > 12) { m = 1; y++; }
  const months = [];
  for (let t = tw(y, m, 1); t < tMax; ) { months.push(t); m++; if (m > 12) { m = 1; y++; } t = tw(y, m, 1); }
  const every = Math.ceil(months.length / (innerWidth < 760 ? 4 : 9));
  let lastY = 0;
  months.forEach((t, i) => { if (i % every) return; const s = document.createElement('span'); s.style.left = ((t - tMin) / span * 100) + '%'; const p = parts(t); s.textContent = p.y !== lastY ? `${p.y}/${p.m}` : `${p.m} 月`; lastY = p.y; el.appendChild(s); });
}

const STORE = 'fleet-island-report-v1';
function load(rows, source, prefer) {
  select(null); clearFleet();
  const info = buildData(rows, source);
  addHP();
  buildStations();
  UNITS.forEach(makeVehicle);
  renderChips(); renderList(); renderTicks(); renderSponsorMarks(); mqCount = -1; fillRegionSelect(); regSel = '__'; updateRegion();

  $('#resetData').hidden = source === EMBED.file;
  simT = prefer && prefer >= tMin && prefer <= tMax ? prefer : tMin + 7 * 3600e3;
  return info;
}
function describe(info, extraBad) {
  const notes = [];
  if (info.swapped) notes.push(`${info.swapped} 筆結束時間早於開始時間，已對調`);
  if (extraBad) notes.push(`${extraBad} 列缺時間或地點而略過`);
  if (info.unknown.length) notes.push(`${info.unknown.length} 個站點認不出位置而略過：${info.unknown.slice(0, 5).map(x => x[0]).join('、')}${info.unknown.length > 5 ? '等' : ''}`);
  return notes.join('；');
}
let XLSXlib = null;
function loadSheetJS() {
  if (XLSXlib) return Promise.resolve(XLSXlib);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => { XLSXlib = window.XLSX; res(XLSXlib); };
    s.onerror = () => rej(new Error('Excel 讀取元件載入失敗，請檢查網路，或先把報表另存成 CSV 再上傳。'));
    document.head.appendChild(s);
  });
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const msg = $('#importMsg'); msg.className = 'msg'; msg.textContent = '讀取中…';
  try {
    const buf = await f.arrayBuffer();
    let table;
    if (/\.(xlsx|xls|xlsm)$/i.test(f.name)) {
      const X = await loadSheetJS();
      const wb = X.read(buf, { type: 'array' });
      table = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '', dateNF: 'yyyy/mm/dd hh:mm' });
    } else table = parseCSV(decode(buf).replace(/^\uFEFF/, ''));
    const { rows, bad } = rowsFromTable(table);
    const info = load(rows, f.name);
    fitCamera(true);
    const note = describe(info, bad);
    msg.textContent = `已匯入 ${NROWS.toLocaleString()} 次用車、${UNITS.length} 個夥伴。` + (note ? note + '。' : '');
    try { localStorage.setItem(STORE, JSON.stringify({ source: f.name, rows })); } catch (err) {}
  } catch (err) { msg.className = 'msg err'; msg.textContent = err.message; }
  e.target.value = '';
});
$('#resetData').onclick = () => {
  try { localStorage.removeItem(STORE); } catch (e) {}
  load(rowsFromEmbed(EMBED), EMBED.file, tw(2026, 3, 24, 6, 30)); fitCamera(true);

let regionKey = '', REGROWS = [], region = null, regSel = '', regMonths = [], regRows = [], lastRegM = -1;
const escH = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hpCountyNow(st) { const g = st.seg; return g.type === 'drive' ? null : HP_COUNTY[g.at[0]] || null; }
function unitInRegion(u, st) {
  if (!region) return true;
  if (u.kind === 'hp') { const c = hpCountyNow(st); return !!c && region.includes(c); }
  const s = STATIONS.get(st.st); return !!s && region.includes(s.county);
}
function monthIdx(ms) { const p = parts(ms), a = parts(tMin); return (p.y - a.y) * 12 + p.m - a.m; }
function monthLabel(i) { const a = parts(tMin), k = a.m - 1 + i; return `${a.y + Math.floor(k / 12)} 年 ${k % 12 + 1} 月`; }
function drawRegionChart() {
  const n = regMonths.length, max = Math.max(1, ...regMonths.map(m => m.n)), W = 300, H = 60, bw = W / n, a = parts(tMin);
  let s = `<svg viewBox="0 0 ${W} ${H + 13}" role="img" aria-label="每月用車趟數">`;
  regMonths.forEach((m, i) => { const h = m.n ? Math.max(2, m.n / max * H) : 0; s += `<rect data-m="${i}" x="${(i * bw + .8).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${Math.max(1, bw - 1.6).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"><title>${monthLabel(i)}：${m.n} 趟</title></rect>`; });
  regMonths.forEach((m, i) => { const k = a.m - 1 + i; if (i === 0 || k % 12 === 0) s += `<text x="${(i * bw + 1).toFixed(1)}" y="${H + 11}">${a.y + Math.floor(k / 12)}/${k % 12 + 1}</text>`; });
  $('#rChart').innerHTML = s + '</svg>';

function updateRegion() {
  const cq = regionKey ? [regionKey] : null, key = regionKey;
  $('#regionSel').value = regionKey;
  if (key === regSel) return;
  regSel = key; region = cq; lastRegM = -1;
  if (!cq) { $('#region').hidden = true; frameView(); return; }
  const nM = monthIdx(tMax) + 1;
  regMonths = Array.from({ length: nM }, () => ({ n: 0, topics: new Map() }));
  regRows = REGROWS.filter(r => cq.includes(r.c));
  const hp = UNITS.find(u => u.kind === 'hp');
  if (hp) hp.ev.forEach(v => { const c = HP_COUNTY[v.st[0]]; if (cq.includes(c)) regRows.push({ s: v.s, c, topic: HP_TOPIC }); });
  regRows.sort((a, b) => a.s - b.s);
  for (const r of regRows) { const m = monthIdx(r.s); if (m >= 0 && m < nM) { const M = regMonths[m]; M.n++; M.topics.set(r.topic, (M.topics.get(r.topic) || 0) + 1); } }
  $('#rTitle').textContent = `${key}的服務動態`;
  drawRegionChart();
  if (!selected) $('#region').hidden = false;
  const pts = [...STATIONS.values()].filter(s => cq.includes(s.county));
  if (hp) hp.ev.forEach(v => { if (cq.includes(HP_COUNTY[v.st[0]])) pts.push({ lat: v.st[1], lng: v.st[2] }); });
  frameView();

    pts.forEach(p => { mx += px(p.lng); mz += pz(p.lat); }); mx /= pts.length; mz /= pts.length;
    pts.forEach(p => { ext = Math.max(ext, Math.hypot(px(p.lng) - mx, pz(p.lat) - mz)); });

    flyTo(new THREE.Vector3(mx, surfaceY(mx, mz), mz), dir.multiplyScalar(Math.max(14, Math.min(60, ext * 3.2 + 10))), 1.1);
  }
}

  const m = new Map();
  for (const [who, partner, date] of SPONSOR_ROWS) {

    if (!e) { const [y, mo, d] = date.split('-').map(Number); e = { who, t: tw(y, mo, d, 10), partners: new Map() }; m.set(key, e); }
    e.partners.set(partner, (e.partners.get(partner) || 0) + 1);
  }
  return [...m.values()].map(e => ({ ...e, n: [...e.partners.values()].reduce((a, b) => a + b, 0), partners: [...e.partners.keys()] })).sort((a, b) => a.t - b.t);
})();
let mqCount = -1;

const sparkTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.3, 'rgba(255,255,255,.85)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const FW_COLORS = ['#456FFF', '#FF846C', '#73A857', '#ffd166', '#ffffff', '#ff6fa8'].map(c => new THREE.Color(c));
const bursts = [];
function spawnBurst(center, scale, delay) {
  if (bursts.length > 40) return;
  const n = isMobile ? 60 : 100, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), vel = new Float32Array(n * 3);
  const c1 = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)], c2 = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u);
    const sp = (.75 + Math.random() * .25) * 1.9 * scale;
    vel[i * 3] = r * Math.cos(a) * sp; vel[i * 3 + 1] = u * sp; vel[i * 3 + 2] = r * Math.sin(a) * sp;
    pos[i * 3] = center.x; pos[i * 3 + 1] = center.y; pos[i * 3 + 2] = center.z;
    const c = Math.random() < .7 ? c1 : c2; col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: .26 * scale, map: sparkTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
  const pts = new THREE.Points(geo, mat); pts.visible = false; pts.frustumCulled = false;
  scene.add(pts);
  bursts.push({ pts, vel, age: 0, life: 1.8, delay, scale });
}
function updateBursts(dt) {
  for (let k = bursts.length - 1; k >= 0; k--) {
    const b = bursts[k];
    if (b.delay > 0) { b.delay -= dt; continue; }
    b.pts.visible = true; b.age += dt;
    const p = b.pts.geometry.attributes.position.array, v = b.vel, drag = Math.max(0, 1 - 1.3 * dt);
    for (let i = 0; i < p.length; i += 3) {
      p[i] += v[i] * dt; p[i + 1] += v[i + 1] * dt; p[i + 2] += v[i + 2] * dt;
      v[i] *= drag; v[i + 2] *= drag; v[i + 1] = v[i + 1] * drag - 2.4 * b.scale * dt;
    }
    b.pts.geometry.attributes.position.needsUpdate = true;
    b.pts.material.opacity = Math.max(0, 1 - (b.age / b.life) ** 2);
    if (b.age >= b.life) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(k, 1); }
  }
}
const unitByName = name => UNITS.find(u => T(u.name) === T(name));
function celebrate(e, jump) {
  if (jump && e.t >= tMin && e.t <= tMax) { simT = e.t; lastSimT = simT; }
  showThanks(e);
  if (reduceMotion) return;
  const camD = camera.position.distanceTo(controls.target), scale = Math.min(2.2, Math.max(.8, camD / 34));
  const per = Math.min(2, Math.ceil(e.n / e.partners.length));
  let k = 0;
  for (const p of e.partners) {
    const u = unitByName(p);
    // 煙火放在受贊助夥伴的車上方；地圖上沒有這個夥伴時放在畫面中央上空
    const base = u && u.g.visible ? u.g.position : controls.target;
    const spread = u && u.g.visible ? 2 : 8;
    for (let i = 0; i < per; i++, k++) {
      const c = new THREE.Vector3(base.x + (Math.random() - .5) * spread * scale, base.y + (2.5 + Math.random() * 2) * scale, base.z + (Math.random() - .5) * spread * .7 * scale);
      spawnBurst(c, scale, k * .35 + Math.random() * .15);
    }
  }
}
let lastSimT = null;
function checkSponsors() {

}
